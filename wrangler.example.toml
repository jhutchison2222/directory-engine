name = "directory-engine-api"
main = "src/index.ts"
compatibility_date = "2025-07-05"
workers_dev = true

[vars]
WORDPRESS_BASE_URL = "https://wordpress.example"
ALLOWED_ORIGINS = "https://console.example"

[[d1_databases]]
binding = "DIRECTORY_DB"
database_name = "directory-engine"
database_id = "00000000-0000-0000-0000-000000000000"

# Existing secret names (set with `wrangler secret put`; never add values here):
# DIRECTORY_ENGINE_API_KEY
# WORDPRESS_USERNAME
# WORDPRESS_APPLICATION_PASSWORD
