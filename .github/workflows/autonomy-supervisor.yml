name: Autonomous supervisor

# Security redesign (owner-authorized): this workflow holds the Workspace
# Agent token secret, so it must never be triggered by an
# event type whose *workflow definition* GitHub loads from a pull request's
# own ref (pull_request, pull_request_review) - a same-repository PR could
# otherwise rewrite this file's steps before the trusted-checkout step even
# ran. schedule, workflow_dispatch, and workflow_run are always loaded from
# the repository's default branch, which keeps this workflow's own
# *definition* untouchable by PR content. Immediate reaction to
# pull_request/pull_request_review/issue_comment events instead happens in
# the separate, unprivileged autonomy-wake.yml workflow, which holds no
# secret and never checks out or executes PR-controlled code; its
# completion wakes this workflow via workflow_run below. See
# docs/automation/autonomy-supervisor.md for the full rationale.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Autonomy wake"]
    types: [completed]

concurrency:
  group: autonomy-supervisor
  cancel-in-progress: false

permissions:
  actions: read
  checks: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Supervise pull requests and queued tasks
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHATGPT_WORKSPACE_AGENT_ID: ${{ vars.CHATGPT_WORKSPACE_AGENT_ID }}
          CHATGPT_WORKSPACE_AGENT_TOKEN: ${{ secrets.CHATGPT_WORKSPACE_AGENT_TOKEN }}
        run: node scripts/run-autonomy-supervisor.mjs
