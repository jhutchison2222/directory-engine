name: Autonomous supervisor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
  pull_request_review:
    types: [submitted, edited, dismissed]
  issue_comment:
    types: [created, edited]
  workflow_run:
    workflows: ["Project governance", "Claude Code"]
    types: [completed]

concurrency:
  group: autonomy-supervisor
  cancel-in-progress: false

permissions:
  actions: read
  checks: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Supervise pull requests and queued tasks
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHATGPT_WORKSPACE_AGENT_ID: ${{ vars.CHATGPT_WORKSPACE_AGENT_ID }}
          CHATGPT_WORKSPACE_AGENT_TOKEN: ${{ secrets.CHATGPT_WORKSPACE_AGENT_TOKEN }}
        run: node scripts/run-autonomy-supervisor.mjs
