name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This allows Claude to read CI results on PRs.
          additional_permissions: |
            actions: read

          # Auto-approve only the exact local validation commands required by DE-0002.
          claude_args: >-
            --allowedTools "Bash(npm install --ignore-scripts --legacy-peer-deps),Bash(npm run check:governance),Bash(npm run typecheck),Bash(npm test),Bash(jq empty project/current-state.json project/fixtures/de-0002-remediation-probe.json),Bash(git diff --check)"

# DE-0004 bootstrap only; Claude must remove this comment in the material implementation.
