name: Autonomy wake

# Security redesign (owner-authorized): this workflow holds NO secrets, NO
# Workspace Agent credential/ID, and NO write permission beyond the minimum
# needed. It exists solely to react quickly to PR/review/comment events and,
# if relevant, wake the secret-bearing "Autonomous supervisor" workflow via
# workflow_run - it never itself talks to the Workspace Agent or merges
# anything. See docs/automation/autonomy-supervisor.md for the full
# rationale for this split.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
  pull_request_review:
    types: [submitted, edited, dismissed]
  issue_comment:
    types: [created, edited]
  workflow_run:
    workflows: ["Project governance", "Claude Code"]
    types: [completed]

concurrency:
  group: autonomy-wake-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Decide whether to wake the supervisor
        run: node scripts/run-autonomy-wake.mjs
